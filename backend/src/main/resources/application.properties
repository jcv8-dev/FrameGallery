spring.application.name=FrameGallery
spring.main.allow-circular-references=true

spring.datasource.url=${FG_DB_URL:jdbc:h2:file:./fg-db/fg-db}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=frameGallery
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

spring.servlet.multipart.max-file-size=${BACKEND_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${BACKEND_MAX_REQUEST_SIZE:50MB}

jwt.expiration-time=3600000

cors.allowed.origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

jwt.secret=${JWT_SECRET}
springdoc.swagger-ui.path=/api/docs/swagger-ui.html

server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState
management.endpoints.web.base-path=/actuator
storage.location=${STORAGE_LOCATION:/upload-dir}