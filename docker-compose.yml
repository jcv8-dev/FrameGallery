services:
  framegallery:
    image: framegallery:${IMAGE_TAG:-latest}
    build: .
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    environment:
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN must be set}
      - BACKEND_MAX_FILE_SIZE=${BACKEND_MAX_FILE_SIZE:-50MB}
      - BACKEND_MAX_REQUEST_SIZE=${BACKEND_MAX_REQUEST_SIZE:-50MB}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - FG_DB_URL=${FG_DB_URL:-jdbc:h2:file:/fg-db/fg-db}
      - STORAGE_LOCATION=/upload-dir
    volumes:
      - fg-images:/upload-dir
      - fg-db:/fg-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  fg-images:
  fg-db:
